# Template only — copy to secret.yaml (gitignored) and fill in real values.
# DATABASE_URL: o host vem de `terraform output -raw database_url` (oficina-infra-database),
#   mas o usuário é o os_user, criado pelo job db-bootstrap-job.yaml com a senha
#   OS_DB_PASSWORD do oficina-db-admin.yaml (a mesma nos dois arquivos).
# JWT_SECRET / JWT_REFRESH_SECRET: generate with `openssl rand -hex 32`
# RESEND_API_KEY: from https://resend.com dashboard
# NEW_RELIC_LICENSE_KEY: New Relic > API keys > tipo INGEST - LICENSE
# RABBITMQ_URL: senha = secret RABBITMQ_PASSWORD do oficina-infra-k8s (a mesma
#   em toda sessão). Ler do cluster:
#   kubectl get secret rabbitmq-credentials -n messaging -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: oficina-backend-secret
  namespace: oficina
type: Opaque
stringData:
  # RDS forces SSL; ?sslmode=no-verify is required (the RDS cert isn't in
  # Node's trust store, and Prisma's runtime driver doesn't negotiate TLS
  # unless the connection string says so — plain "require" fails to verify).
  DATABASE_URL: "postgresql://os_user:password@rds-endpoint:5432/oficina_db?sslmode=no-verify"
  JWT_SECRET: "replace-with-a-strong-random-secret"
  JWT_REFRESH_SECRET: "replace-with-a-different-strong-random-secret"
  RESEND_API_KEY: "re_your_resend_api_key"
  NEW_RELIC_LICENSE_KEY: "your_new_relic_ingest_license_key"
  # Broker da saga (ADR-010). O último "/oficina" é o vhost. Sem esta chave a
  # API sobe, mas a mensageria fica desligada e o outbox só acumula.
  RABBITMQ_URL: "amqp://oficina:password@rabbitmq.messaging.svc.cluster.local:5672/oficina"
