# Applied by the CD pipeline before rolling out a new Deployment revision.
# `kubectl apply -f migration-job.yaml && kubectl wait --for=condition=complete job/oficina-backend-migrate -n oficina --timeout=120s`
apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-backend-migrate
  namespace: oficina
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      # A migração não fala com a API do Kubernetes; sem o token da service
      # account montado, um processo comprometido no pod não tem o que usar.
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: REPLACE_WITH_ECR_IMAGE_URI:latest
          command: ["npm", "run", "prisma:migrate:deploy"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 128Mi
          envFrom:
            - secretRef:
                name: oficina-backend-secret
