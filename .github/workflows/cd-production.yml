name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Esteira padrão dos microsserviços (docs/arquitetura/esteira-ci-cd.md). Para
# usar em outro serviço, copie este arquivo e mude só as três últimas
# variáveis; o corpo não depende do nome do serviço.
env:
  AWS_REGION: sa-east-1
  K3S_NODE_TAG: oficina-backend-k3s-node
  ECR_REPOSITORY: oficina-backend   # repositório no ECR (oficina-infra-k8s)
  K8S_NAMESPACE: oficina            # namespace do serviço no cluster
  DEPLOYMENT_NAME: oficina-backend  # Deployment em k8s/deployment.yaml

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Só faz deploy depois de um CI verde disparado por um *push* na main
    # deste repositório. O filtro `branches: [main]` sozinho não basta: um PR
    # vindo de um fork cuja branch também se chame "main" dispararia o deploy
    # com o código do fork e as credenciais AWS de produção.
    # (workflow_dispatch não tem contexto de workflow_run e passa direto.)
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    # Add required reviewers to the "production" Environment in
    # Settings > Environments so this job pauses for manual approval
    # before it runs.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run always checks out the default branch by default;
          # pin to the exact commit CI validated instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The k3s node's IP/instance ID change every time /infra is
      # destroyed and re-applied, so it's discovered by tag at deploy time
      # instead of being hardcoded or read from local Terraform state
      # (which never leaves the operator's machine).
      - name: Find the k3s node
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${K3S_NODE_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::No running k3s instance found (tag Name=${K3S_NODE_TAG}). Run 'terraform apply' in /infra first."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          echo "Found $INSTANCE_ID at $PUBLIC_IP"
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Fetch kubeconfig via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cat /etc/rancher/k3s/k3s.yaml"]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text \
            | sed "s/127.0.0.1/${PUBLIC_IP}/" > "${RUNNER_TEMP}/kubeconfig.yaml"

          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Build and push image to ECR
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE="${ECR_URL}:${{ github.sha }}"

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URL"
          docker build -t "$IMAGE" -t "${ECR_URL}:latest" .
          docker push "$IMAGE"
          docker push "${ECR_URL}:latest"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: 'latest'

      # Namespace/ConfigMap/Secret are applied once by hand right after
      # `terraform apply` (see k8s/README.md) and aren't touched here —
      # the DB password and API keys they hold don't need to live in CI.
      # Usuários do banco (ADR-014): os_user para o OS e auth_reader para a Lambda de CPF.
      - name: Bootstrap database users
        if: hashFiles('k8s/db-bootstrap-job.yaml') != ''
        run: |
          set -euo pipefail
          kubectl get secret oficina-db-admin -n oficina > /dev/null || {
            echo "::error::Aplique k8s/oficina-db-admin.yaml antes do deploy (ver k8s/README.md)."
            exit 1
          }
          kubectl delete job oficina-db-bootstrap -n oficina --ignore-not-found
          kubectl apply -f k8s/db-bootstrap-job.yaml
          kubectl wait --for=condition=complete job/oficina-db-bootstrap -n oficina --timeout=120s

      # Só para serviços com banco relacional (Prisma). Quem não tem
      # k8s/migration-job.yaml (ex.: Execution Service, com MongoDB) pula.
      - name: Run database migration
        if: hashFiles('k8s/migration-job.yaml') != ''
        run: |
          set -euo pipefail
          sed "s#REPLACE_WITH_ECR_IMAGE_URI:latest#${IMAGE}#" k8s/migration-job.yaml > "${RUNNER_TEMP}/migration-job.yaml"
          kubectl delete -f "${RUNNER_TEMP}/migration-job.yaml" --ignore-not-found
          kubectl apply -f "${RUNNER_TEMP}/migration-job.yaml"
          kubectl wait --for=condition=complete -f "${RUNNER_TEMP}/migration-job.yaml" --timeout=120s

      # Manifestos opcionais (ingress, hpa) só são aplicados se existirem.
      - name: Deploy application manifests
        run: |
          set -euo pipefail
          sed "s#REPLACE_WITH_ECR_IMAGE_URI:latest#${IMAGE}#" k8s/deployment.yaml | kubectl apply -f -
          for f in service ingress hpa; do
            if [ -f "k8s/${f}.yaml" ]; then kubectl apply -f "k8s/${f}.yaml"; fi
          done
          kubectl rollout status "deployment/${DEPLOYMENT_NAME}" -n "${K8S_NAMESPACE}" --timeout=180s
