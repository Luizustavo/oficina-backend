name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  # Placeholder connection string, only used where prisma needs a syntactically
  # valid DATABASE_URL but no live database (lint/unit/build jobs).
  PLACEHOLDER_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # O ESLint precisa dos tipos do Prisma Client para checar os mappers.
      # Com --ignore-scripts o npm ci não gera mais esses tipos sozinho.
      - run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ env.PLACEHOLDER_DATABASE_URL }}
      - run: npm run lint

  unit-tests:
    name: Unit Tests (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ env.PLACEHOLDER_DATABASE_URL }}
      # O Jest falha sozinho se a cobertura ficar abaixo de 80%
      # (coverageThreshold no package.json).
      - run: npm test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # Análise estática + Quality Gate no SonarCloud. Reaproveita o relatório de
  # cobertura do job anterior em vez de rodar os testes de novo. Se o Quality
  # Gate reprovar (cobertura de código novo < 80%, bugs, vulnerabilidades,
  # duplicação...), o job falha e o PR fica bloqueado.
  quality:
    name: Quality (SonarCloud)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    env:
      # Valores criados ao importar o repositório no SonarCloud
      # (Project Information, no painel do projeto).
      SONAR_ORGANIZATION: luizustavo
      SONAR_PROJECT_KEY: Luizustavo_oficina-backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o Sonar usa o git blame para saber o que é
          # "código novo" no PR.
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: SonarCloud scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_test_db
          POSTGRES_USER: oficina_user
          # Banco descartável do CI: sem senha (trust), em vez de uma senha fixa no código.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U oficina_user -d oficina_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # Broker dos testes de mensageria (outbox, consumidor idempotente,
      # retentativa e DLQ). A senha é o id da execução: descartável e sem
      # credencial fixa no código.
      rabbitmq:
        image: rabbitmq:4.1
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-${{ github.run_id }}
        ports:
          - 5672:5672
        # Roda como o usuário do RabbitMQ (999): como root, a imagem 4.1 de
        # 11/11/2026 cria o .erlang.cookie sem permissão de leitura para ele.
        options: >-
          --user 999:999
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://oficina_user@localhost:5432/oficina_test_db
      RABBITMQ_URL: amqp://ci:ci-${{ github.run_id }}@localhost:5672
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run test:int

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_test_db
          POSTGRES_USER: oficina_user
          # Banco descartável do CI: sem senha (trust), em vez de uma senha fixa no código.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U oficina_user -d oficina_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://oficina_user@localhost:5432/oficina_test_db
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run test:e2e

  bdd-tests:
    name: BDD
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_test_db
          POSTGRES_USER: oficina_user
          # Banco descartável do CI: sem senha (trust), em vez de uma senha fixa no código.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U oficina_user -d oficina_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://oficina_user@localhost:5432/oficina_test_db
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run test:bdd

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, quality, integration-tests, e2e-tests, bdd-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ env.PLACEHOLDER_DATABASE_URL }}
      - run: npm run build
      - name: Docker build (smoke test only, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          build-args: |
            DATABASE_URL=${{ env.PLACEHOLDER_DATABASE_URL }}
          # Disponibiliza a imagem para o passo seguinte (sem push).
          load: true
          tags: oficina-backend:ci

      # A imagem instala as dependências com --ignore-scripts e roda sem root.
      # Este passo garante que, mesmo assim, ela tem o que precisa para subir.
      - name: Smoke test da imagem
        run: |
          set -euo pipefail
          run() {
            local cmd="$1"
            docker run --rm --entrypoint sh oficina-backend:ci -c "$cmd"
          }
          [ "$(run 'id -u')" != "0" ] || { echo "::error::A imagem roda como root"; exit 1; }
          run "node -e \"require('bcrypt').hashSync('x', 4)\"" && echo "bcrypt ok"
          run "ls node_modules/@prisma/engines | grep -q schema-engine" && echo "motor de migração do Prisma ok"
          run "ls generated/prisma | grep -q query_engine" && echo "motor de consultas do Prisma ok"
          run "test -f dist/main.js || test -f dist/src/main.js" && echo "build ok"
