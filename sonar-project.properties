# Configuração comum às duas formas de rodar o Sonar:
#   - SonarCloud, no job "Quality (SonarCloud)" do ci.yml. O CI acrescenta
#     sonar.organization e sonar.projectKey do SonarCloud por linha de comando;
#   - SonarQube local via Docker (docker-compose.sonar.yml, ver README).
sonar.projectKey=oficina-backend
sonar.projectName=Oficina - OS Service
sonar.projectVersion=1.0

# Código-fonte de produção (excluir specs e gerados)
sonar.sources=src
# docker-compose*.yml: ambiente de desenvolvimento local (Postgres e SonarQube na
# máquina do desenvolvedor), com senhas fixas de propósito. Não vai para produção:
# lá as credenciais vêm de Secrets do Kubernetes.
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,docker-compose*.yml

# Arquivos de teste (para cruzar com cobertura)
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Cobertura gerada por `npm test -- --coverage` (testes unitários).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# O que entra na conta da cobertura é o mesmo que o Jest mede e cobra (80%,
# `collectCoverageFrom` no package.json): as camadas de domínio e de aplicação,
# onde estão as regras de negócio. Controllers, repositórios Prisma, módulos
# do Nest e o bootstrap (infrastructure/, shared/, arquivos da raiz de src/)
# são cobertos pelos testes de integração e E2E, que não geram lcov. Sem esta
# linha o Sonar contaria esses arquivos como 0% e reprovaria o Quality Gate
# por um número diferente do que o CI de fato mede.
sonar.coverage.exclusions=src/infrastructure/**,src/shared/**,src/*.ts,**/*.module.ts,**/*.interface.ts

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
